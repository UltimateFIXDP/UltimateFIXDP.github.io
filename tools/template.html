<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UltimateFIXDP — the all-in-one fix for Deadly Premonition: The Director's Cut</title>
  <meta name="description" content="{{desc}}">
  <meta name="keywords" content="Deadly Premonition, Director's Cut, fix, DPfix, UltimateFIXDP, 180 FPS, HBAO, DualSense, mod manager, Greenvale, Swery, Little Bit, Ukrainian, фікс, українізатор">
  <meta name="author" content="Dmytro Bidlov (Little Bit)">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#c4192b">
  <link rel="canonical" href="{{site}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{site}}">
  <meta property="og:site_name" content="UltimateFIXDP">
  <meta property="og:title" content="UltimateFIXDP — the all-in-one fix for Deadly Premonition">
  <meta property="og:description" content="One DLL: stability, 45 → 180 FPS, HBAO, SMAA, Xbox 360 look, DualSense, mod manager, photo mode. UA + EN.">
  <meta property="og:image" content="{{site}}og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="uk_UA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UltimateFIXDP — the all-in-one fix for Deadly Premonition">
  <meta name="twitter:image" content="{{site}}og-image.jpg">
  <script type="application/ld+json">{{ldjson}}</script>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-lang="en">

  <div class="bg">
    <div class="bg-image"></div>
    <div class="bg-rain"></div>
    <div class="bg-gradient"></div>
    <div class="bg-vignette"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#top">
      <img src="logo.png" alt="UltimateFIXDP" class="brand-logo">
      <span class="brand-text">
        <span class="brand-title">ULTIMATE</span>
        <span class="brand-sub">FIX · DP</span>
      </span>
    </a>
    <nav class="nav">
      <a href="#new" data-i18n="nav.new"></a>
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#mods" data-i18n="nav.mods"></a>
      <a href="#shots" data-i18n="nav.shots"></a>
      <a href="#install" data-i18n="nav.install"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="topbar-right">
      <a class="topbar-icon" href="{{repo}}" target="_blank" rel="noopener" data-i18n-title="hero.viewRepo" title="View on GitHub" aria-label="View on GitHub">{{gh}}</a>
      <div class="lang-switch">
        <button class="lang-btn" data-set-lang="en">EN</button>
        <button class="lang-btn" data-set-lang="uk">UK</button>
      </div>
    </div>
  </header>

  <section class="hero" id="top">
    <div class="hero-inner">
      <a class="successor" href="#new" data-i18n-html="hero.whatsnew"></a>
      <div class="badge" data-i18n="hero.badge"></div>
      <h1 class="hero-title">
        <span class="hero-line">DEADLY</span>
        <span class="hero-line">PREMONITION</span>
      </h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <p class="hero-tagline" data-i18n="hero.tagline"></p>
      <div class="hero-actions">
        <a class="btn-launch" id="download-btn" href="{{repo}}/releases/latest" target="_blank" rel="noopener">
          <span class="btn-launch-glow"></span>
          <span class="btn-launch-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="btn-launch-label" data-i18n="hero.download"></span>
          <span class="btn-launch-meta" id="download-meta">— · Latest</span>
        </a>
      </div>
      <div class="hero-meta">
        <span class="hero-dot"></span>
        <span data-i18n="hero.steam"></span>
        <span class="hero-sep">·</span>
        <span data-i18n="hero.one"></span>
        <span class="hero-sep">·</span>
        <span data-i18n="hero.langs"></span>
        <span class="hero-sep" id="downloads-sep" hidden>·</span>
        <span id="downloads" hidden><span id="downloads-count"></span> <span data-i18n="hero.downloads"></span></span>
      </div>
    </div>
    <a class="hero-scroll" href="#new" aria-label="Scroll down"><span></span></a>
  </section>

  <div class="stats">
{{stats}}
  </div>

  <section class="section" id="new">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="new.eyebrow"></span>
      <h2 class="section-title" data-i18n="new.title"></h2>
    </header>
    <div class="grid grid-4">
{{news}}
    </div>
    <p class="install-note known" data-i18n-html="new.known"></p>
    <p class="center"><a class="link-red" href="{{repo}}/releases/latest" target="_blank" rel="noopener" data-i18n="new.all"></a></p>
  </section>

  <section class="section" id="before">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="before.eyebrow"></span>
      <h2 class="section-title" data-i18n="before.title"></h2>
    </header>
    <div class="ba glass-card">
      <div class="ba-row ba-head"><div class="ba-cell ba-old"><span data-i18n="before.a"></span></div><div class="ba-arrow"></div><div class="ba-cell ba-new"><span data-i18n="before.b"></span></div></div>
{{before}}
    </div>
  </section>

  <section class="section" id="features">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="features.eyebrow"></span>
      <h2 class="section-title" data-i18n="features.title"></h2>
    </header>
    <div class="grid grid-3">
{{features}}
    </div>
  </section>

  <section class="section" id="engine">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="engine.eyebrow"></span>
      <h2 class="section-title" data-i18n="engine.title"></h2>
      <p class="section-lead" data-i18n="engine.lead"></p>
    </header>
    <div class="grid grid-3">
{{engine}}
    </div>
  </section>

  <section class="section" id="shots">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="shots.eyebrow"></span>
      <h2 class="section-title" data-i18n="shots.title"></h2>
    </header>
    <div class="shots">
{{shots}}
    </div>
  </section>

  <section class="section" id="mods">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="mods.eyebrow"></span>
      <h2 class="section-title" data-i18n="mods.title"></h2>
      <p class="section-lead" data-i18n-html="mods.lead"></p>
    </header>
    <div class="mods-wrap">
      <div class="glass-card tree-card reveal">{{tree}}</div>
      <div class="mods-cards">
        <article class="glass-card reveal"><h3 data-i18n="mods.c1.t"></h3><p data-i18n-html="mods.c1.d"></p></article>
        <article class="glass-card reveal"><h3 data-i18n="mods.c2.t"></h3><p data-i18n-html="mods.c2.d"></p></article>
        <article class="glass-card reveal"><h3 data-i18n="mods.c3.t"></h3><p data-i18n-html="mods.c3.d"></p></article>
      </div>
    </div>
  </section>

  <section class="section" id="install">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="install.eyebrow"></span>
      <h2 class="section-title" data-i18n="install.title"></h2>
    </header>
    <ol class="steps">
      <li class="glass-card step reveal"><span class="step-num">1</span><h3 data-i18n="install.s1.t"></h3><p data-i18n-html="install.s1.d"></p></li>
      <li class="glass-card step reveal"><span class="step-num">2</span><h3 data-i18n="install.s2.t"></h3><p data-i18n-html="install.s2.d"></p></li>
      <li class="glass-card step reveal"><span class="step-num">3</span><h3 data-i18n="install.s3.t"></h3><p data-i18n-html="install.s3.d"></p></li>
    </ol>
    <p class="install-note" data-i18n="install.note"></p>
  </section>

  <section class="section" id="keys">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="keys.eyebrow"></span>
      <h2 class="section-title" data-i18n="keys.title"></h2>
    </header>
    <div class="keys-grid glass-card reveal">
{{keys}}
    </div>
  </section>

  <section class="section" id="faq">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="faq.eyebrow"></span>
      <h2 class="section-title" data-i18n="faq.title"></h2>
    </header>
    <div class="faq-list">
{{faq}}
    </div>
  </section>

  <section class="section" id="credits">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="credits.eyebrow"></span>
      <h2 class="section-title" data-i18n="credits.title"></h2>
      <p class="section-lead" data-i18n="credits.lead"></p>
    </header>
    <div class="credits-grid">
{{credits}}
    </div>
    <p class="install-note testers" data-i18n-html="credits.testers"></p>
  </section>

  <section class="section cta">
    <div class="glass-card cta-card reveal">
      <h2 class="section-title" data-i18n="cta.title"></h2>
      <p class="section-lead" data-i18n="cta.text"></p>
      <div class="cta-actions">
        <a class="btn-launch" id="download-btn-2" href="{{repo}}/releases/latest" target="_blank" rel="noopener">
          <span class="btn-launch-glow"></span>
          <span class="btn-launch-label" data-i18n="hero.download"></span>
        </a>
        <a class="btn-ghost" href="{{repo}}/issues" target="_blank" rel="noopener" data-i18n="cta.issue"></a>
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <header class="section-head">
      <span class="section-eyebrow" data-i18n="about.eyebrow"></span>
      <h2 class="section-title" data-i18n="about.title"></h2>
    </header>
    <div class="glass-card about-card">
      <p data-i18n-html="about.line1"></p>
      <p data-i18n="about.line2"></p>
      <p class="about-thanks" data-i18n="about.thanks"></p>
      <div class="about-links">
        <a href="https://t.me/LittleBitUA" target="_blank" rel="noopener" class="about-link">{{tg}} Telegram</a>
        <a href="{{repo}}" target="_blank" rel="noopener" class="about-link">{{gh}} GitHub</a>
        <a href="https://www.youtube.com/@UA_LittleBit" target="_blank" rel="noopener" class="about-link">{{yt}} YouTube</a>
        <a href="https://steamcommunity.com/id/bidlochuk/" target="_blank" rel="noopener" class="about-link">{{st}} Steam</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p data-i18n-html="footer.line"></p>
    <p class="footer-disclaimer" data-i18n="footer.disclaimer"></p>
  </footer>

  <div class="lightbox" id="lightbox" hidden><img alt=""><button class="lightbox-close" aria-label="Close">×</button></div>

  <button class="scroll-top" id="scroll-top" aria-label="Scroll to top" data-i18n-title="ui.scrollTop" title="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
