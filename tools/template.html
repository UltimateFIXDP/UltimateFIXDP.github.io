<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UltimateFIXDP — the all-in-one fix for Deadly Premonition: The Director's Cut</title>
  <meta name="description" content="{{desc}}">
  <meta name="keywords" content="Deadly Premonition, Director's Cut, fix, DPfix, UltimateFIXDP, 180 FPS, HBAO, DualSense, mod manager, Greenvale, Swery, Little Bit, Ukrainian, фікс, українізатор">
  <meta name="author" content="Dmytro Bidlov (Little Bit)">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0B0B0C">
  <link rel="canonical" href="{{site}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{site}}">
  <meta property="og:site_name" content="UltimateFIXDP">
  <meta property="og:title" content="UltimateFIXDP — the all-in-one fix for Deadly Premonition">
  <meta property="og:description" content="One DLL: stability, 45 → 180 FPS, HBAO, SMAA, Xbox 360 look, DualSense, mod manager, photo mode. UA + EN.">
  <meta property="og:image" content="{{site}}og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="uk_UA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UltimateFIXDP — the all-in-one fix for Deadly Premonition">
  <meta name="twitter:image" content="{{site}}og-image.jpg">
  <script type="application/ld+json">{{ldjson}}</script>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-lang="en">

  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#top"><img src="logo.png" alt="" width="30" height="30"><span>UltimateFIXDP</span></a>
      <nav class="nav" aria-label="Sections">
        <a href="#features" data-i18n="nav.features"></a>
        <a href="#new" data-i18n="nav.new"></a>
        <a href="#mods" data-i18n="nav.mods"></a>
        <a href="#install" data-i18n="nav.install"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </nav>
      <div class="top-right">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-set-lang="en">EN</button>
          <button type="button" class="lang-btn" data-set-lang="uk">UK</button>
        </div>
        <a class="btn-white" id="download-btn-top" href="{{repo}}/releases/latest" data-i18n="nav.download"></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero wrap" id="top">
      <a class="pill" href="#new"><span class="dot"></span><span data-i18n="hero.pill"></span><span class="pill-arrow">→</span></a>
      <h1 data-i18n-html="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="actions">
        <a class="btn-accent" id="download-btn" href="{{repo}}/releases/latest">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
          <span data-i18n="hero.dl"></span>
        </a>
        <a class="btn-line" href="{{repo}}" target="_blank" rel="noopener" data-i18n="hero.code"></a>
      </div>
      <p class="meta"><span data-i18n="hero.meta"></span> · <span id="download-meta">v0.7.0</span><span id="downloads" hidden> · <span id="downloads-count"></span> <span data-i18n="hero.downloads"></span></span></p>
    </section>

    <section class="wrap">
      <div class="fx reveal" id="fx">
        <div class="fx-bar"><span class="fx-name">UltimateFIXDP</span><span class="fx-close" data-i18n="menu.close"></span></div>
        <div class="fx-body">
          <div class="fx-tabs" role="tablist" aria-label="Menu sections">
          {{menu_tabs}}
          </div>
        {{menu_panels}}
        </div>
      </div>
      <p class="fx-try" data-i18n="menu.hint"></p>
    </section>

    <section class="wrap stats2" aria-label="In numbers">
{{stats2}}
    </section>

    <section class="wrap block" id="features">
      <div class="head">
        <h2 data-i18n="f2.title"></h2>
        <p data-i18n="f2.lead"></p>
      </div>
      <div class="bento">
        <article class="tile tile-wide tile-perf reveal">
          <div class="tile-kicker" data-i18n="bt.perf"></div>
          <div>
            <div class="perf"><span class="perf-old">45</span><span class="perf-arrow">→</span><span class="perf-new">180</span><span class="perf-unit">FPS</span></div>
            <p data-i18n="bt.perf.d"></p>
          </div>
        </article>
        <article class="tile reveal">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
          <div><h3 data-i18n="bt.stab"></h3><p data-i18n="bt.stab.d"></p></div>
        </article>
        <article class="tile reveal">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <div><h3 data-i18n="bt.saves"></h3><p data-i18n="bt.saves.d"></p></div>
        </article>
        <article class="tile tile-img reveal">
          <a class="zoom" href="screenshots/menu-graphics.jpg"><img src="screenshots/menu-graphics.jpg" alt="" width="1920" height="1080" loading="lazy"></a>
          <div class="tile-pad"><h3 data-i18n="bt.gfx"></h3><p data-i18n="bt.gfx.d"></p></div>
        </article>
        <article class="tile tile-wide tile-mods reveal">
          <div class="tile-mods-text">
            <div class="tile-kicker" data-i18n="bt.mods"></div>
            <h3 class="tile-big" data-i18n="bt.mods.t"></h3>
            <p data-i18n="bt.mods.d"></p>
          </div>
          <pre class="tile-tree">mods\
└─ <span class="t-red">UA\</span>
   ├─ fontwide.xpc
   └─ mes_all.mes</pre>
        </article>
        <article class="tile reveal">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 10v4M5 12h4"/></svg>
          <div><h3 data-i18n="bt.pad"></h3><p data-i18n="bt.pad.d"></p></div>
        </article>
      </div>
      <h3 class="more-title" data-i18n="more.title"></h3>
      <div class="more"><div class="more-item"><h3 data-i18n="f.x360.t"></h3><p data-i18n-html="f.x360.d"></p></div><div class="more-item"><h3 data-i18n="f.map.t"></h3><p data-i18n-html="f.map.d"></p></div><div class="more-item"><h3 data-i18n="f.story.t"></h3><p data-i18n-html="f.story.d"></p></div><div class="more-item"><h3 data-i18n="f.photo.t"></h3><p data-i18n-html="f.photo.d"></p></div><div class="more-item"><h3 data-i18n="f.tools.t"></h3><p data-i18n-html="f.tools.d"></p></div><div class="more-item"><h3 data-i18n="f.lang.t"></h3><p data-i18n-html="f.lang.d"></p></div></div>
    </section>

    <section class="wrap block" id="new">
      <div class="head">
        <h2 data-i18n="n2.title"></h2>
      </div>
      <ul class="news2-list">
{{news2}}
      </ul>
      <p class="note" data-i18n-html="new.known"></p>
      <p><a class="link" href="{{repo}}/releases/latest" target="_blank" rel="noopener" data-i18n="new.all"></a></p>
    </section>


    <section class="wrap block" id="engine">
      <div class="head">
        <h2 data-i18n="e2.title"></h2>
        <p data-i18n="engine.lead"></p>
      </div>
      <div class="cards cards-3">
{{engine}}
      </div>
    </section>

    <section class="wrap block" id="mods">
      <div class="split split-center">
        <div class="split-side">
          <h2 data-i18n="m2.title"></h2>
          <p data-i18n-html="m2.lead"></p>
          <div class="mods-points">
            <div><h3 data-i18n="mods.c1.t"></h3><p data-i18n-html="mods.c1.d"></p></div>
            <div><h3 data-i18n="mods.c2.t"></h3><p data-i18n-html="mods.c2.d"></p></div>
            <div><h3 data-i18n="mods.c3.t"></h3><p data-i18n-html="mods.c3.d"></p></div>
          </div>
        </div>
        <div class="tree-box reveal">{{tree}}</div>
      </div>
    </section>

    <section class="wrap block" id="shots">
      <div class="head">
        <h2 data-i18n="sh2.title"></h2>
      </div>
      <div class="shots">
{{shots}}
      </div>
    </section>

    <section class="wrap block" id="install">
      <div class="head">
        <h2 data-i18n="i2.title"></h2>
      </div>
      <ol class="cards cards-3 steps">
        <li class="card step reveal"><span class="num">1</span><h3 data-i18n="install.s1.t"></h3><p data-i18n-html="install.s1.d"></p></li>
        <li class="card step reveal"><span class="num">2</span><h3 data-i18n="install.s2.t"></h3><p data-i18n-html="install.s2.d"></p></li>
        <li class="card step reveal"><span class="num">3</span><h3 data-i18n="install.s3.t"></h3><p data-i18n-html="install.s3.d"></p></li>
      </ol>
      <p class="note" data-i18n="install.note"></p>
    </section>

    <section class="wrap block" id="keys">
      <div class="head">
        <h2 data-i18n="k2.title"></h2>
      </div>
      <div class="keys reveal">
{{keys}}
      </div>
    </section>

    <section class="wrap block" id="faq">
      <div class="split">
        <div class="split-side"><h2 data-i18n="q2.title"></h2></div>
        <div class="faq-list">
{{faq}}
        </div>
      </div>
    </section>

    <section class="wrap block" id="credits">
      <div class="head">
        <h2 data-i18n="cr2.title"></h2>
        <p data-i18n="credits.lead"></p>
      </div>
      <div class="cards cards-3 credits">
{{credits}}
      </div>
      <p class="note" data-i18n-html="credits.testers"></p>
    </section>

    <section class="wrap block">
      <div class="cta reveal">
        <h2 data-i18n="cta2.title"></h2>
        <p data-i18n="cta2.text"></p>
        <div class="actions">
          <a class="btn-accent" id="download-btn-2" href="{{repo}}/releases/latest" data-i18n="nav.download"></a>
          <a class="btn-line" href="{{repo}}/issues" target="_blank" rel="noopener" data-i18n="cta.issue"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-row">
      <div class="foot-text">
        <p data-i18n-html="footer.line"></p>
        <p class="small" data-i18n="footer.disclaimer"></p>
      </div>
      <nav class="foot-links" aria-label="Links">
        <a href="https://t.me/LittleBitUA" target="_blank" rel="noopener">Telegram</a>
        <a href="{{repo}}" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.youtube.com/@UA_LittleBit" target="_blank" rel="noopener">YouTube</a>
        <a href="https://steamcommunity.com/id/bidlochuk/" target="_blank" rel="noopener">Steam</a>
      </nav>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden><img alt=""><button class="lightbox-close" type="button" aria-label="Close">×</button></div>

  <button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top" data-i18n-title="ui.scrollTop" title="Scroll to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
